<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizMaster — Interactive Quiz App</title>
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-dark: #5849c4;
      --primary-light: #a29bf0;
      --accent: #00cec9;
      --success: #00b894;
      --danger: #e74c3c;
      --warning: #fdcb6e;
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface-hover: #232342;
      --text: #f5f5f7;
      --text-muted: #8a8a9a;
      --border: #2a2a4a;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.3);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(108,92,231,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0,206,201,0.06) 0%, transparent 50%);
    }

    /* ====== APP CONTAINER ====== */
    .quiz-app {
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* ====== HEADER ====== */
    .quiz-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      padding: 28px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .quiz-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .quiz-header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .quiz-header .logo-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .score-badge {
      background: rgba(255,255,255,0.15);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    /* ====== PROGRESS BAR ====== */
    .progress-container {
      padding: 0 32px;
      margin-top: 20px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 3px;
      transition: width var(--transition);
      width: 0%;
    }

    /* ====== QUESTION AREA ====== */
    .question-area {
      padding: 28px 32px 32px;
    }
    .question-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .category-tag {
      background: rgba(108,92,231,0.15);
      color: var(--primary-light);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .difficulty-tag {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .difficulty-easy { background: rgba(0,184,148,0.15); color: var(--success); }
    .difficulty-medium { background: rgba(253,203,110,0.15); color: var(--warning); }
    .difficulty-hard { background: rgba(231,76,60,0.15); color: var(--danger); }

    .question-text {
      font-size: 1.3rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* ====== OPTIONS ====== */
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all var(--transition);
      user-select: none;
    }
    .option:hover {
      border-color: var(--primary-light);
      background: var(--surface-hover);
      transform: translateX(4px);
    }
    .option .option-letter {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
      transition: all var(--transition);
    }
    .option:hover .option-letter {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .option .option-text {
      font-size: 1rem;
      flex: 1;
    }
    .option.correct {
      border-color: var(--success);
      background: rgba(0,184,148,0.1);
    }
    .option.correct .option-letter {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }
    .option.correct::after {
      content: "✓";
      color: var(--success);
      font-size: 1.2rem;
      font-weight: 700;
    }
    .option.wrong {
      border-color: var(--danger);
      background: rgba(231,76,60,0.1);
    }
    .option.wrong .option-letter {
      background: var(--danger);
      border-color: var(--danger);
      color: white;
    }
    .option.wrong::after {
      content: "✕";
      color: var(--danger);
      font-size: 1.2rem;
      font-weight: 700;
    }
    .option.disabled { pointer-events: none; opacity: 0.6; }
    .option.disabled.correct, .option.disabled.wrong { opacity: 1; }

    /* ====== FEEDBACK ====== */
    .feedback {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .feedback.show { display: flex; }
    .feedback.correct { background: rgba(0,184,148,0.1); color: var(--success); border: 1px solid rgba(0,184,148,0.3); }
    .feedback.wrong { background: rgba(231,76,60,0.1); color: var(--danger); border: 1px solid rgba(231,76,60,0.3); }

    /* ====== BUTTONS ====== */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,92,231,0.4); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary {
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--primary-light); color: var(--text); }

    /* ====== START SCREEN ====== */
    .start-screen, .result-screen {
      padding: 48px 32px;
      text-align: center;
    }
    .start-screen .hero-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    .start-screen h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    .start-screen p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .quiz-info {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 28px;
    }
    .quiz-info .info-item {
      text-align: center;
    }
    .quiz-info .info-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary-light);
    }
    .quiz-info .info-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ====== RESULT SCREEN ====== */
    .result-screen .result-emoji { font-size: 3.5rem; margin-bottom: 16px; }
    .result-screen h2 { font-size: 1.8rem; margin-bottom: 8px; }
    .result-score {
      font-size: 3rem;
      font-weight: 800;
      margin: 16px 0;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .result-message { color: var(--text-muted); font-size: 1.05rem; margin-bottom: 28px; }
    .result-stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
    }
    .result-stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 22px;
      text-align: center;
    }
    .result-stat .stat-value { font-size: 1.4rem; font-weight: 700; }
    .result-stat .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    .hidden { display: none !important; }

    /* ====== ANIMATIONS ====== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.3s ease; }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 500px) {
      .quiz-header { padding: 20px; }
      .question-area { padding: 20px; }
      .progress-container { padding: 0 20px; }
      .question-text { font-size: 1.1rem; }
      .quiz-info { gap: 16px; }
    }
  </style>
</head>
<body>

<div class="quiz-app" id="quizApp">

  <!-- ===== START SCREEN ===== -->
  <div id="startScreen" class="start-screen fade-in">
    <div class="hero-icon">🧠</div>
    <h2>QuizMaster</h2>
    <p>Test your knowledge across multiple categories.<br>Answer 7 questions and see how you score!</p>
    <div class="quiz-info">
      <div class="info-item">
        <div class="info-value" id="totalQuestions">7</div>
        <div class="info-label">Questions</div>
      </div>
      <div class="info-item">
        <div class="info-value">~3 min</div>
        <div class="info-label">Duration</div>
      </div>
      <div class="info-item">
        <div class="info-value">3</div>
        <div class="info-label">Categories</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()" style="max-width:240px; margin:0 auto; display:block;">Start Quiz</button>
  </div>

  <!-- ===== QUIZ SCREEN ===== -->
  <div id="quizScreen" class="hidden">
    <div class="quiz-header">
      <div class="logo">
        <div class="logo-icon">🧠</div>
        <h1>QuizMaster</h1>
      </div>
      <div class="score-badge">Score: <span id="scoreDisplay">0</span></div>
    </div>

    <div class="progress-container">
      <div class="progress-info">
        <span>Question <span id="currentQNum">1</span> of <span id="totalQNum">7</span></span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="question-area">
      <div class="question-meta">
        <span class="category-tag" id="categoryTag">Science</span>
        <span class="difficulty-tag" id="difficultyTag">Easy</span>
      </div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsContainer"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn btn-secondary" onclick="quitQuiz()">Quit</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Next</button>
      </div>
    </div>
  </div>

  <!-- ===== RESULT SCREEN ===== -->
  <div id="resultScreen" class="hidden">
    <div class="quiz-header">
      <div class="logo">
        <div class="logo-icon">🧠</div>
        <h1>QuizMaster</h1>
      </div>
    </div>
    <div class="result-screen fade-in" style="text-align:center;">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle">Quiz Complete!</h2>
      <div class="result-score" id="resultScore">0/7</div>
      <p class="result-message" id="resultMessage"></p>
      <div class="result-stats">
        <div class="result-stat">
          <div class="stat-value" id="statCorrect" style="color:var(--success)">0</div>
          <div class="stat-label">Correct</div>
        </div>
        <div class="result-stat">
          <div class="stat-value" id="statWrong" style="color:var(--danger)">0</div>
          <div class="stat-label">Wrong</div>
        </div>
        <div class="result-stat">
          <div class="stat-value" id="statPercent" style="color:var(--accent)">0%</div>
          <div class="stat-label">Accuracy</div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="restartQuiz()" style="max-width:240px; margin:0 auto; display:block;">Try Again</button>
    </div>
  </div>

</div>

<script>
  // ====== QUIZ DATA ======
  const quizData = [
    {
      category: "Science",
      difficulty: "easy",
      question: "What is the chemical symbol for gold?",
      options: ["Au", "Ag", "Gd", "Go"],
      answer: 0
    },
    {
      category: "Geography",
      difficulty: "medium",
      question: "Which country has the longest coastline in the world?",
      options: ["Australia", "Russia", "Canada", "Indonesia"],
      answer: 2
    },
    {
      category: "Science",
      difficulty: "medium",
      question: "What is the powerhouse of the cell?",
      options: ["Nucleus", "Ribosome", "Mitochondria", "Golgi apparatus"],
      answer: 2
    },
    {
      category: "History",
      difficulty: "hard",
      question: "In which year did the Berlin Wall fall?",
      options: ["1987", "1989", "1991", "1993"],
      answer: 1
    },
    {
      category: "Geography",
      difficulty: "easy",
      question: "What is the capital city of Japan?",
      options: ["Seoul", "Beijing", "Bangkok", "Tokyo"],
      answer: 3
    },
    {
      category: "History",
      difficulty: "medium",
      question: "Who was the first Emperor of Rome?",
      options: ["Julius Caesar", "Nero", "Augustus", "Caligula"],
      answer: 2
    },
    {
      category: "Science",
      difficulty: "hard",
      question: "What is the speed of light in a vacuum (approx)?",
      options: ["150,000 km/s", "300,000 km/s", "450,000 km/s", "1,000,000 km/s"],
      answer: 1
    }
  ];

  // ====== STATE ======
  let currentIndex = 0;
  let score = 0;
  let correctCount = 0;
  let wrongCount = 0;
  let answered = false;

  // ====== FUNCTIONS ======
  function startQuiz() {
    currentIndex = 0;
    score = 0;
    correctCount = 0;
    wrongCount = 0;
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');
    document.getElementById('quizScreen').classList.add('fade-in');
    document.getElementById('totalQNum').textContent = quizData.length;
    loadQuestion();
  }

  function loadQuestion() {
    answered = false;
    const q = quizData[currentIndex];
    document.getElementById('currentQNum').textContent = currentIndex + 1;
    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('categoryTag').textContent = q.category;

    const diffTag = document.getElementById('difficultyTag');
    diffTag.textContent = q.difficulty.charAt(0).toUpperCase() + q.difficulty.slice(1);
    diffTag.className = 'difficulty-tag difficulty-' + q.difficulty;

    document.getElementById('questionText').textContent = q.question;

    // Progress
    const progress = ((currentIndex) / quizData.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressPercent').textContent = Math.round(progress) + '%';

    // Options
    const container = document.getElementById('optionsContainer');
    container.innerHTML = '';
    const letters = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option fade-in';
      div.style.animationDelay = (i * 0.08) + 's';
      div.innerHTML = `
        <div class="option-letter">${letters[i]}</div>
        <div class="option-text">${opt}</div>
      `;
      div.onclick = () => selectOption(i, div);
      container.appendChild(div);
    });

    // Reset feedback & button
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('nextBtn').textContent = currentIndex === quizData.length - 1 ? 'See Results' : 'Next';
  }

  function selectOption(index, element) {
    if (answered) return;
    answered = true;

    const q = quizData[currentIndex];
    const allOptions = document.querySelectorAll('.option');
    allOptions.forEach(o => o.classList.add('disabled'));

    const feedback = document.getElementById('feedback');

    if (index === q.answer) {
      element.classList.add('correct');
      score++;
      correctCount++;
      feedback.className = 'feedback show correct';
      feedback.innerHTML = '✓ <span>Correct! Well done.</span>';
      document.getElementById('scoreDisplay').textContent = score;
    } else {
      element.classList.add('wrong');
      element.classList.add('shake');
      wrongCount++;
      // Highlight correct answer
      allOptions[q.answer].classList.add('correct');
      allOptions[q.answer].classList.remove('disabled');
      feedback.className = 'feedback show wrong';
      feedback.innerHTML = '✕ <span>Wrong! The correct answer was <b>' + q.options[q.answer] + '</b>.</span>';
    }

    document.getElementById('nextBtn').disabled = false;
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex >= quizData.length) {
      showResults();
    } else {
      loadQuestion();
    }
  }

  function showResults() {
    // Final progress
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100%';

    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.remove('hidden');

    const percent = Math.round((score / quizData.length) * 100);
    document.getElementById('resultScore').textContent = score + '/' + quizData.length;
    document.getElementById('statCorrect').textContent = correctCount;
    document.getElementById('statWrong').textContent = wrongCount;
    document.getElementById('statPercent').textContent = percent + '%';

    const emoji = document.getElementById('resultEmoji');
    const title = document.getElementById('resultTitle');
    const msg = document.getElementById('resultMessage');

    if (percent === 100) {
      emoji.textContent = '🏆';
      title.textContent = 'Perfect Score!';
      msg.textContent = 'Outstanding! You got every question right.';
    } else if (percent >= 70) {
      emoji.textContent = '🎉';
      title.textContent = 'Great Job!';
      msg.textContent = 'You really know your stuff. Keep it up!';
    } else if (percent >= 40) {
      emoji.textContent = '💪';
      title.textContent = 'Good Effort!';
      msg.textContent = 'Not bad! A little more practice and you\'ll ace it.';
    } else {
      emoji.textContent = '📚';
      title.textContent = 'Keep Learning!';
      msg.textContent = 'Don\'t worry — practice makes perfect. Try again!';
    }
  }

  function restartQuiz() {
    document.getElementById('resultScreen').classList.add('hidden');
    startQuiz();
  }

  function quitQuiz() {
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('startScreen').classList.remove('hidden');
    document.getElementById('startScreen').classList.add('fade-in');
  }
</script>

</body>
</html>
