<div class="login-wrapper">
    <div class="login-card">

        <!-- Header -->
        <div class="login-header">
            <div class="icon-container">
                <svg class="icon-lock" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="title">Selamat Datang</h1>
            <p class="subtitle">Sila log masuk ke akaun anda</p>
        </div>

        <!-- Form -->
        <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)" class="login-form">

            <!-- Username -->
            <div class="form-group">
                <label class="form-label">Nama Pengguna (Username)</label>
                <input type="text" [(ngModel)]="credentials.username" name="username" required class="form-input"
                    placeholder="Masukkan username">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label">Kata Laluan (Password)</label>
                <input type="password" [(ngModel)]="credentials.password" name="password" required class="form-input"
                    placeholder="Masukkan password">
            </div>

            <!-- Mesej Ralat -->
            <div *ngIf="errorMessage" class="error-alert">
                <svg class="icon-error" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>{{ errorMessage }}</span>
            </div>

            <!-- Butang Login -->
            <button type="submit" [disabled]="isLoading || !loginForm.valid" class="btn-submit">

                <!-- Loading Spinner -->
                <svg *ngIf="isLoading" class="spinner" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>

                <span>{{ isLoading ? 'Sedang Log Masuk...' : 'Log Masuk' }}</span>
            </button>

        </form>
    </div>
</div>
