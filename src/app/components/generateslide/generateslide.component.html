<div class="generate-slide-container">
    <h2>Penjana Slaid</h2>

    <div class="payload-preview">
        <h3>Data yang akan dihantar:</h3>

        <div class="form-group">
            <label for="topic"><strong>Topik:</strong></label>
            <input type="text" id="topic" [(ngModel)]="payload.topic" class="form-control" placeholder="Masukkan topik">
        </div>

        <div class="form-group">
            <label for="description"><strong>Penerangan:</strong></label>
            <textarea id="description" [(ngModel)]="payload.description" class="form-control" rows="3"
                placeholder="Masukkan penerangan"></textarea>
        </div>

        <div class="form-group">
            <label for="total_slides"><strong>Jumlah Slaid:</strong></label>
            <input type="number" id="total_slides" [(ngModel)]="payload.total_slides" class="form-control" min="1">
        </div>
    </div>

    <button class="btn-submit" (click)="sendPostRequest()" [disabled]="isLoading">
        <span *ngIf="!isLoading">Hantar Permintaan</span>
        <span *ngIf="isLoading">Sedang Dihantar...</span>
    </button>

    <div *ngIf="responseMessage" [ngClass]="{'success-msg': isSuccess, 'error-msg': !isSuccess}" class="status-message">
        {{ responseMessage }}
    </div>
</div>
