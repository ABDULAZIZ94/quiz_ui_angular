<div class="card-container">
  @if (flashcardService.currentWord; as word) {
  <div class="card" [class.flipped]="flashcardService.isFlipped()" (click)="flashcardService.flip()">

    <!-- Muka Depan Kad -->
    <div class="card-face card-front">
      <div class="arabic-text">{{ word.arabic }}</div>
      <div class="hint">Tap to reveal meaning</div>
    </div>

    <!-- Muka Belakang Kad -->
    <div class="card-face card-back">
      <div class="english">{{ word.english }}</div>
      <div class="translit">{{ word.translit }}</div>
      <div class="category">{{ word.category }}</div>
      <div class="example" [innerHTML]="word.example"></div>
      <button class="speak-btn" (click)="$event.stopPropagation(); flashcardService.speak()">🔊</button>
    </div>

  </div>
  } @else if (flashcardService.loading()) {
  <div class="loading-state">
    <p>Memuatkan kad perkataan...</p>
  </div>
  } @else {
  <div class="empty-state">
    <p>Tiada data perkataan ditemui.</p>
  </div>
  }
</div>
