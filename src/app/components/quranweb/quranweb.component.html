<div class="quran-container" [class.fullscreen-mode]="isFullscreen">
    <h2>Quran Web Component</h2>

    <!-- Bar Navigasi Surah & Butang Tindakan -->
    <div class="nav-bar" *ngIf="!isLoading && senaraiAyat.length > 0">
        <div class="filter-group">
            <label for="surahSelect">Pilih Surah:</label>
            <select id="surahSelect" [(ngModel)]="surahDipilih" (change)="tukarSurah()">
                <option value="0">-- Semua Surah (1-114) --</option>
                <option *ngFor="let s of senaraiSurahNo" [value]="s">
                    Surah {{ s }}
                </option>
            </select>
        </div>

        <button class="btn btn-fullscreen" (click)="toggleFullscreen()">
            {{ isFullscreen ? 'Keluar Fullscreen' : 'Fullscreen' }}
        </button>

        <button class="reset-btn" (click)="padamCacheAndReload()" [disabled]="isLoading">
            Muat Semula Data
        </button>
    </div>

    <!-- Mesej Status / Error -->
    <div *ngIf="isLoading" class="status-msg">
        Sedang memuat turun data Al-Quran...
    </div>
    <div *ngIf="errorMessage" class="error-msg">
        {{ errorMessage }}
    </div>
    <div *ngIf="!isLoading && senaraiAyatDitapis.length === 0 && senaraiAyat.length > 0" class="status-msg warning">
        Tiada ayat ditemui.
    </div>

    <!-- Bahagian Paparan 1 Ayat & Navigasi Nombor -->
    <div *ngIf="!isLoading && senaraiAyatDitapis.length > 0" class="single-ayat-wrapper">

        <!-- Senarai Nombor Ayat Boleh Diklik -->
        <div class="number-bar">
            <button *ngFor="let item of senaraiAyatDitapis; let i = index" class="num-btn"
                [class.active]="i === currentIndex" [class.hafal]="isHafal(item)" (click)="pilihAyat(i)">
                {{ item.ayatNo }}
            </button>
        </div>

        <!-- Kad Ayat Utama (1 Ayat Sahaja) -->
        <div class="ayat-card" *ngIf="ayatSemasa">
            <div class="ayat-header">
                <span class="badge">Surah: {{ ayatSemasa.surahNo }}</span>
                <span class="badge">Ayat: {{ ayatSemasa.ayatNo }}</span>
                <button class="btn-hafal" [class.marked]="isHafal(ayatSemasa)" (click)="toggleHafal(ayatSemasa)">
                    {{ isHafal(ayatSemasa) ? '✓ Dah Hafal' : 'Tanda Dah Hafal' }}
                </button>
            </div>

            <div class="arabic-text">
                {{ ayatSemasa.teksArab }}
            </div>

            <div class="translation-text">
                {{ ayatSemasa.terjemahan }}
            </div>

            <!-- Butang Kawalan Prev & Next -->
            <div class="card-controls">
                <button class="btn nav-btn" (click)="prevAyat()" [disabled]="currentIndex === 0">
                    &laquo; Prev
                </button>
                <span class="info-posisi">{{ currentIndex + 1 }} / {{ senaraiAyatDitapis.length }}</span>
                <button class="btn nav-btn" (click)="nextAyat()"
                    [disabled]="currentIndex === senaraiAyatDitapis.length - 1">
                    Next &raquo;
                </button>
            </div>
        </div>

    </div>
</div>
