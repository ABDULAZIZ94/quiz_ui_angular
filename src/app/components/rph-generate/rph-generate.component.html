<div class="rph-container">
    <!-- Panel Kawalan & Navigasi -->
    <div class="control-panel no-print">
        <div class="lang-selector">
            <label><strong>Pilih Bahasa / اختر اللغة:</strong></label>
            <button type="button" [class.active]="selectedLanguage === 'jawi'" (click)="tukarBahasa('jawi')">جاوي
                (Jawi)</button>
            <button type="button" [class.active]="selectedLanguage === 'ar'" (click)="tukarBahasa('ar')">العربية
                (Arab)</button>
            <button type="button" [class.active]="selectedLanguage === 'ms'" (click)="tukarBahasa('ms')">Bahasa
                Melayu</button>
            <button type="button" [class.active]="selectedLanguage === 'en'"
                (click)="tukarBahasa('en')">English</button>
        </div>

        <div class="action-buttons">
            <!-- BUTANG SELESAI & JANA -->
            <button type="button" class="btn-nav btn-finish" (click)="janaRph()" [disabled]="isLoading">
                <span *ngIf="!isLoading">🚀 Selesai & Jana</span>
                <span *ngIf="isLoading">⏳ Sedang Menjana...</span>
            </button>

            <!-- BUTANG EXPORT -->
            <button type="button" class="btn-export btn-pdf" (click)="exportToPdf()"
                [disabled]="isLoading || rphList.length === 0">
                📄 Simpan PDF
            </button>
            <button type="button" class="btn-export btn-word" (click)="exportToWord()"
                [disabled]="isLoading || rphList.length === 0">
                📝 Simpan Word (.doc)
            </button>
        </div>
    </div>

    <!-- Indikator Loading -->
    <div *ngIf="isLoading" class="loading-state no-print">
        <div class="spinner"></div>
        <p>Sedang menjana RPH dengan Gemini AI...</p>
    </div>

    <!-- Mesej Ralat -->
    <div *ngIf="errorMessage" class="error-alert no-print">
        {{ errorMessage }}
    </div>

    <!-- Paparan RPH -->
    <!-- ... (Kekalkan templat jadual RPH seperti sebelumnya) ... -->
</div>
