<div class="card-list-container">
    <h2>Senarai Kad Bahasa Cina (Chinese Card)</h2>

    <!-- Kotak Carian -->
    <div class="search-box">
        <input type="text" [(ngModel)]="searchTerm" (input)="filterCards()"
            placeholder="Cari Hanzi, Pinyin, atau Maksud..." />
    </div>

    <!-- Status Memuatkan -->
    <div *ngIf="loading" class="loading-msg">
        Memuatkan senarai kad dari pangkalan data... ⏳
    </div>

    <!-- Grid Senarai Kad -->
    <div *ngIf="!loading" class="cards-grid">
        <div *ngFor="let card of filteredCardList" class="flashcard-item" [class.flipped]="card.isFlipped"
            (click)="flipCard(card)">

            <div class="card-inner">
                <div class="card-front">
                    <h1>{{ card.hanzi }}</h1>
                    <p class="hint">Tekan untuk lihat maksud</p>
                </div>

                <div class="card-back">
                    <h3>{{ card.pinyin }}</h3>
                    <p class="meaning">{{ card.meaning }}</p>
                    <p class="hint">Tekan semula untuk kembali</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Jika tiada keputusan carian -->
    <div *ngIf="!loading && filteredCardList.length === 0" class="no-result">
        Tiada kad yang sepadan dengan carian anda.
    </div>
</div>
