<div class="score-container">
    <!-- Kanvas Three.js Latar Belakang 3D -->
    <canvas #threeCanvas class="three-background"></canvas>

    <div class="score-content-wrapper">
        <div class="header-top">
            <h2>🏆 Papan Skor</h2>
            <button (click)="refreshData()" class="btn-refresh" [disabled]="isLoading">
                🔄 {{ isLoading ? 'Memuatkan...' : 'Refresh Data' }}
            </button>
        </div>

        <div class="controls">
            <!-- Tapisan Subjek -->
            <select [(ngModel)]="selectedSubject" (ngModelChange)="onFilterChange()" class="filter-select">
                <option value="">-- Semua Subjek --</option>
                <option *ngFor="let subject of availableSubjects" [value]="subject">
                    {{ subject }}
                </option>
            </select>

            <!-- Carian Nama (Hadkan kepada 20 aksara) -->
            <input type="text" placeholder="Cari nama pengguna..." [(ngModel)]="searchTerm"
                (ngModelChange)="onFilterChange()" class="search-input" maxlength="20" />

            <!-- Butang Susunan Skor -->
            <button (click)="toggleSort()" class="sort-btn">
                Susunan Skor:
                <strong>{{ sortDescendingScore ? 'Tertinggi ⬇️' : 'Terendah ⬆️' }}</strong>
            </button>
        </div>

        <div *ngIf="isLoading" class="loading">Sedang memuat turun data...</div>

        <div class="table-responsive" *ngIf="!isLoading">
            <table>
                <thead>
                    <tr>
                        <th>Kedudukan</th>
                        <th>Tarikh & Masa</th>
                        <th>Nama Pengguna</th>
                        <th>Subjek</th>
                        <th>Skor</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let record of filteredData; let i = index" [class.top-one]="i === 0"
                        [class.top-two]="i === 1" [class.top-three]="i === 2">
                        <td>
                            <span class="rank-badge" *ngIf="i === 0">🥇 1</span>
                            <span class="rank-badge" *ngIf="i === 1">🥈 2</span>
                            <span class="rank-badge" *ngIf="i === 2">🥉 3</span>
                            <span *ngIf="i > 2">{{ i + 1 }}</span>
                        </td>
                        <td>{{ record.timestamp }}</td>
                        <td class="name-column"><strong [title]="record.name">{{ record.name }}</strong></td>
                        <td><span class="subject-badge">{{ record.subject }}</span></td>
                        <td><span class="score-badge-val">{{ record.score }}</span></td>
                    </tr>
                    <tr *ngIf="filteredData.length === 0">
                        <td colspan="5" class="no-data">Tiada rekod dijumpai berdasarkan carian/tapisan ini.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
