<div class="container-fluid py-4 no-print">
    <div class="card shadow-sm max-w-3xl mx-auto p-4 mb-4 bg-white rounded">

        <!-- Navigasi Mod Paparan -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h3 class="text-primary fw-bold m-0">Jana RPH AI (Gemini)</h3>

            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-primary" [class.active]="viewMode === 'web'"
                    (click)="viewMode = 'web'">
                    Borang Input
                </button>
                <button type="button" class="btn btn-outline-primary" [class.active]="viewMode === 'print'"
                    (click)="viewMode = 'print'">
                    Print Layout (A4)
                </button>
            </div>
        </div>

        <!-- BORANG INPUT 3 MEDAN -->
        <form (ngSubmit)="hantarData()" *ngIf="viewMode === 'web'">

            <div class="mb-3">
                <label class="form-label fw-bold">Action</label>
                <input type="text" class="form-control bg-light" [(ngModel)]="formData.action" name="action" readonly
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Prompt Utama *</label>
                <textarea class="form-control" rows="3" [(ngModel)]="formData.prompt" name="prompt"
                    placeholder="Masukkan arahan RPH..." required></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Arahan Tambahan</label>
                <textarea class="form-control" rows="3" [(ngModel)]="formData.arahan_tambahan" name="arahan_tambahan"
                    placeholder="Masukkan arahan/kekangan tambahan (jika ada)..."></textarea>
            </div>

            <div class="d-flex gap-2 flex-wrap border-top pt-3">
                <button type="submit" class="btn btn-primary px-4" [disabled]="isLoading">
                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1"></span>
                    {{ isLoading ? 'Sedang Menjana RPH...' : 'Jana RPH (Hantar JSON)' }}
                </button>
                <button type="button" class="btn btn-danger px-4" (click)="exportPdf()">
                    Cetak / PDF
                </button>
                <button type="button" class="btn btn-info text-white px-4" (click)="exportWord()">
                    Eksport Word
                </button>
            </div>

            <div *ngIf="responseMessage" class="mt-3 alert" [ngClass]="isError ? 'alert-danger' : 'alert-success'">
                {{ responseMessage }}
            </div>
        </form>

        <!-- KAWALAN PADA PAPARAN PRINT LAYOUT -->
        <div *ngIf="viewMode === 'print'" class="text-center py-2">
            <div class="d-flex justify-content-center gap-2 mb-3">
                <button type="button" class="btn btn-danger" (click)="exportPdf()">Cetak / Simpan PDF</button>
                <button type="button" class="btn btn-info text-white" (click)="exportWord()">Eksport ke Word</button>
            </div>
            <p class="text-muted small">Pratonton Templat Cetakan A4</p>
        </div>

    </div>
</div>

<!-- CONTAINER UNTUK REKA BENTUK TEMPLAT HTML ASAL -->
<div class="print-area" [class.d-none]="viewMode === 'web'" id="rendered-rph-container" [innerHTML]="renderedTemplate">
</div>
